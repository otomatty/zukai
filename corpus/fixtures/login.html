<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>管理画面にログイン</title>
<style>
body{margin:0;background:#eef1f4;font-family:"Hiragino Sans","Yu Gothic UI","Noto Sans JP","Noto Sans CJK JP",sans-serif;color:#1c2530}
main{width:360px;margin:72px auto;padding:28px;background:#fff;border:1px solid #dfe4ea;border-radius:10px}
h1{font-size:20px;margin:0 0 20px}
label{display:block;font-size:13px;color:#5b6673;margin:14px 0 4px}
input{width:100%;box-sizing:border-box;height:42px;padding:0 12px;border:1px solid #93a0ad;border-radius:6px;font-size:15px}
.alert{margin:18px 0 0;padding:10px 14px;background:#fdecea;border-radius:6px;font-size:13px;line-height:1.6;color:#8a1c13}
button{width:100%;height:46px;margin:16px 0 0;border:0;border-radius:6px;background:#1c2530;color:#fff;font-size:15px;font-weight:600}
.reset{display:inline-block;margin:16px 0 0;font-size:14px;color:#0f5f8a}
.who{position:absolute;top:16px;right:24px;font-size:13px;color:#5b6673}
</style>
</head>
<body>
<div class="who">前回のログイン: yamada.taro@example.com</div>
<main>
<h1>管理画面にログイン</h1>
<label for="id">ID</label><input id="id" value="yamada.taro">
<label for="pw">パスワード</label><input id="pw" type="password" value="password">
<div class="alert">アカウントをロックしました。<br>あと12分で解除されます。</div>
<button type="button">ログイン</button>
<a class="reset" href="#">パスワードを再設定する</a>
</main>
</body>
</html>
