version: 0.2

phases:
  pre_build:
    commands:
      - aws ecr get-login-password | docker login --username AWS --password-stdin $ECR_REGISTRY
      - npm ci
      - npm test
  build:
    commands:
      - docker build -t $ECR_REGISTRY/order-api:$CODEBUILD_RESOLVED_SOURCE_VERSION .
  post_build:
    commands:
      - docker push $ECR_REGISTRY/order-api:$CODEBUILD_RESOLVED_SOURCE_VERSION
      - printf '[{"name":"order-api","imageUri":"%s"}]' $ECR_REGISTRY/order-api:$CODEBUILD_RESOLVED_SOURCE_VERSION > imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
